name: Build & Publish SUSHEE Karaoke APK Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v1.2.0)'
        required: true
        default: 'v1.2.0'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Node dependencies
        run: npm install --no-audit --no-fund

      - name: Run automated feature & behavioral tests
        run: npm test

      - name: Prepare web assets & sync Capacitor Android
        run: |
          node prepare-www.js
          npx cap sync android

      - name: Configure Android signing & build APK
        env:
          SUSHEE_STORE_PASSWORD: ${{ secrets.SUSHEE_STORE_PASSWORD }}
          SUSHEE_KEY_PASSWORD: ${{ secrets.SUSHEE_KEY_PASSWORD }}
        run: |
          chmod +x android/gradlew
          TAG="${{ github.event.inputs.tag_name || github.ref_name }}"
          echo "RELEASE_TAG=${TAG}" >> $GITHUB_ENV

          if [ -n "$SUSHEE_STORE_PASSWORD" ] && [ -n "$SUSHEE_KEY_PASSWORD" ] && [ -f android/app/sushee-release.jks ]; then
            echo "Building SIGNED release APK..."
            cd android && ./gradlew assembleRelease
            cd ..
            cp android/app/build/outputs/apk/release/app-release.apk "SUSHEE-Karaoke-${TAG}.apk"
            cp android/app/build/outputs/apk/release/app-release.apk "SUSHEE-Karaoke-Release.apk"
          else
            echo "::warning::SUSHEE_STORE_PASSWORD / SUSHEE_KEY_PASSWORD secrets not set. Falling back to assembleDebug."
            cd android && ./gradlew assembleDebug
            cd ..
            cp android/app/build/outputs/apk/debug/app-debug.apk "SUSHEE-Karaoke-${TAG}.apk"
            cp android/app/build/outputs/apk/debug/app-debug.apk "SUSHEE-Karaoke-Release.apk"
          fi

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: SUSHEE Karaoke ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: |
            SUSHEE-Karaoke-${{ env.RELEASE_TAG }}.apk
            SUSHEE-Karaoke-Release.apk
            php-server/version.json
