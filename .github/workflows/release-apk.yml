name: Build & Publish SUSHEE Karaoke APK Release

on:
  push:
    branches:
      - main
    paths:
      - 'package.json'
      - 'android/app/build.gradle'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (opsional, kosongkan untuk pakai versi package.json)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release tag & skip if already released
        id: meta
        run: |
          PKG_VER=$(node -p "require('./package.json').version")
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v${PKG_VER}"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" != refs/tags/* ]]; then
            if git rev-parse "refs/tags/${TAG}" >/dev/null 2>&1; then
              echo "Tag ${TAG} already exists; skipping duplicate release."
              echo "should_release=false" >> $GITHUB_OUTPUT
              exit 0
            fi
          fi
          echo "should_release=true" >> $GITHUB_OUTPUT

      - name: Setup Node.js 20
        if: steps.meta.outputs.should_release == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 21 (Temurin)
        if: steps.meta.outputs.should_release == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Node dependencies
        if: steps.meta.outputs.should_release == 'true'
        run: npm install --no-audit --no-fund

      - name: Run automated feature & behavioral tests
        if: steps.meta.outputs.should_release == 'true'
        run: npm test

      - name: Prepare web assets & sync Capacitor Android
        if: steps.meta.outputs.should_release == 'true'
        run: |
          node prepare-www.js
          npx cap sync android

      - name: Configure Android signing & build APK
        if: steps.meta.outputs.should_release == 'true'
        env:
          SUSHEE_STORE_PASSWORD: ${{ secrets.SUSHEE_STORE_PASSWORD }}
          SUSHEE_KEY_PASSWORD: ${{ secrets.SUSHEE_KEY_PASSWORD }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          chmod +x android/gradlew
          if [ -n "$SUSHEE_STORE_PASSWORD" ] && [ -n "$SUSHEE_KEY_PASSWORD" ] && [ -f android/app/sushee-release.jks ]; then
            echo "Building SIGNED release APK..."
            cd android && ./gradlew assembleRelease
            cd ..
            cp android/app/build/outputs/apk/release/app-release.apk "SUSHEE-Karaoke-${RELEASE_TAG}.apk"
            cp android/app/build/outputs/apk/release/app-release.apk "SUSHEE-Karaoke-Release.apk"
          else
            echo "::warning::SUSHEE_STORE_PASSWORD / SUSHEE_KEY_PASSWORD secrets not set. Falling back to assembleDebug."
            cd android && ./gradlew assembleDebug
            cd ..
            cp android/app/build/outputs/apk/debug/app-debug.apk "SUSHEE-Karaoke-${RELEASE_TAG}.apk"
            cp android/app/build/outputs/apk/debug/app-debug.apk "SUSHEE-Karaoke-Release.apk"
          fi

      - name: Publish GitHub Release with APK
        if: steps.meta.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: SUSHEE Karaoke ${{ steps.meta.outputs.tag }}
          generate_release_notes: true
          files: |
            SUSHEE-Karaoke-${{ steps.meta.outputs.tag }}.apk
            SUSHEE-Karaoke-Release.apk
            php-server/version.json
